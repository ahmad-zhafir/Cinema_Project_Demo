name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Download JDatePicker JAR
        run: |
          mkdir -p build/lib
          curl -L -o build/lib/jdatepicker-1.3.4.jar https://repo1.maven.org/maven2/org/jdatepicker/jdatepicker/1.3.4/jdatepicker-1.3.4.jar
          echo "Downloaded files:"
          ls -l build/lib

      - name: Build project with Ant
        run: ant clean compile -Dlib.dir=build/lib

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ahmad-zhafir_Cinema_Project_Demo
            -Dsonar.organization=ahmad-zhafir
            -Dsonar.sources=src
            -Dsonar.java.binaries=build/classes
          projectBaseDir: .
